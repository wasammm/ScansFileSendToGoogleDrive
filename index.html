<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A4 Scanner Pro (Fast & Fixed Name)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --a4-width: 85vw;
            --a4-height: calc(var(--a4-width) * 1.414);
            --max-a4-height: 68vh; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #fff;
        }
        
        #camera-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter 0.2s; }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none; 
            display: flex; justify-content: center; align-items: center;
            background-color: rgba(0, 0, 0, 0.6); 
        }

        #scan-region {
            width: var(--a4-width); height: var(--a4-height); max-height: var(--max-a4-height);
            border: 2px solid #00ff00; border-radius: 4px; background-color: transparent; 
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.6); position: relative;
            margin-top: -12vh;
        }
        
        #scan-region::after {
            content: "ĐẶT GIẤY A4 VÀO ĐÂY";
            position: absolute; top: 50%; left: 0; width: 100%;
            text-align: center; color: #00ff00; font-size: 12px; font-weight: bold;
            transform: translateY(-50%); text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        #bwBtn {
            position: absolute; top: max(20px, env(safe-area-inset-top)); right: 20px; 
            width: 50px; height: 50px; border-radius: 50%; 
            background: rgba(0,0,0,0.6); border: 2px solid #888; 
            color: white; font-size: 22px; 
            display: flex; justify-content: center; align-items: center;
            z-index: 10; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #bwBtn.active { background: #007bff; border-color: #007bff; box-shadow: 0 0 10px #007bff; }

        #controls-container {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 3; 
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 70%, transparent 100%);
            padding: 15px 20px calc(15px + env(safe-area-inset-bottom)); 
            display: flex; flex-direction: column; gap: 12px; align-items: center;
        }

        #ui-info { width: 100%; text-align: center; display: flex; flex-direction: column; gap: 2px; }
        #pageCount { font-size: 18px; font-weight: bold; color: #ffd700; }
        #status { font-size: 13px; color: #bbb; min-height: 1.5em; }

        .toolbar { width: 100%; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; }
        .slider-group { display: flex; align-items: center; gap: 10px; width: 100%; color: #eee; font-size: 13px; font-weight: 500; }
        .slider-group input[type="range"] { flex: 1; height: 15px; accent-color: #007bff; }
        .slider-label { width: 45px; text-align: right; }

        .filename-group { width: 100%; max-width: 400px; display: flex; gap: 8px; align-items: center; }
        #fileNameInput {
            flex: 1; padding: 10px 15px; border-radius: 8px; border: 1px solid #555;
            background: rgba(0,0,0,0.6); color: white; font-size: 14px; outline: none;
            text-align: center; font-family: monospace; font-weight: bold;
        }
        #fileNameInput:focus { border-color: #007bff; background: rgba(0,0,0,0.8); }

        .action-row { display: flex; gap: 15px; width: 100%; max-width: 400px; justify-content: center; }
        .action-btn { flex: 1; padding: 15px; font-size: 15px; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
        
        #finishBtn { background-color: #007bff; color: white; opacity: 0.4; pointer-events: none; } 
        #snapBtn { background-color: #28a745; color: white; }
        
        .action-btn:active { transform: scale(0.95); }

        canvas { display: none; }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="camera" autoplay playsinline muted></video>
    </div>

    <div id="overlay">
        <div id="scan-region"></div>
    </div>

    <button id="bwBtn" title="Chuyển chế độ Trắng/Đen">🌗</button>

    <div id="controls-container">
        <div id="ui-info">
            <div id="pageCount">Chưa có trang nào</div>
            <div id="status">Sẵn sàng</div>
        </div>

        <div class="toolbar">
            <div class="slider-group">
                <span>☀️ Sáng</span>
                <input type="range" id="brightness" min="50" max="180" value="100">
                <span class="slider-label" id="brightVal">100%</span>
            </div>
            <div class="slider-group">
                <span>🌓 Tương Phản</span>
                <input type="range" id="contrast" min="50" max="250" value="100">
                <span class="slider-label" id="contrastVal">100%</span>
            </div>
        </div>

        <div class="filename-group">
            <input type="text" id="fileNameInput" placeholder="Nhập tên file PDF...">
        </div>

        <div class="action-row">
            <button id="finishBtn" class="action-btn">🚀 Lưu Drive</button>
            <button id="snapBtn" class="action-btn">📸 Chụp</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // THAY URL CỦA GOOGLE APPS SCRIPT VÀO ĐÂY
        const GAS_WEB_APP_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL'; 
        
        // Tên file mặc định
        const DEFAULT_FILE_NAME = "PB1301";

        const video = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const statusDiv = document.getElementById('status');
        const pageCountDiv = document.getElementById('pageCount');
        const scanRegion = document.getElementById('scan-region');
        
        const snapBtn = document.getElementById('snapBtn');
        const finishBtn = document.getElementById('finishBtn');
        const bwBtn = document.getElementById('bwBtn');
        const brightnessInput = document.getElementById('brightness');
        const contrastInput = document.getElementById('contrast');
        const brightVal = document.getElementById('brightVal');
        const contrastVal = document.getElementById('contrastVal');
        const fileNameInput = document.getElementById('fileNameInput');

        let doc = null;
        let pageCount = 0;
        let isBwOn = false;

        // Gán tên mặc định khi vừa mở app
        fileNameInput.value = DEFAULT_FILE_NAME;

        function updateUI() {
            if (pageCount === 0) {
                finishBtn.style.opacity = '0.4';
                finishBtn.style.pointerEvents = 'none';
                snapBtn.innerText = "📸 Chụp Trang 1";
                pageCountDiv.innerText = "Chưa có trang nào";
            } else {
                finishBtn.style.opacity = '1';
                finishBtn.style.pointerEvents = 'auto';
                snapBtn.innerText = `📸 Chụp Trang ${pageCount + 1}`;
                pageCountDiv.innerText = `Đã chụp: ${pageCount} trang`;
            }
        }

        async function startCamera() {
            statusDiv.innerText = "Đang mở camera...";
            try {
                const constraints = { 
                    video: { facingMode: { exact: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                statusDiv.innerText = "Sẵn sàng quét";
                video.play().catch(e => { statusDiv.innerText = "Chạm màn hình để bật camera"; });
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({video: { facingMode: "environment" }});
                    video.srcObject = fallbackStream;
                    statusDiv.innerText = "Sẵn sàng (Camera tiêu chuẩn)";
                } catch(e2) {
                    statusDiv.innerText = "Lỗi camera: " + e2.message;
                }
            }
        }
        startCamera();

        function updateFilters() { 
            video.style.filter = `brightness(${brightnessInput.value}%) contrast(${contrastInput.value}%) ${isBwOn ? 'grayscale(100%)' : ''}`;
        }

        brightnessInput.addEventListener('input', (e) => { brightVal.innerText = e.target.value + '%'; updateFilters(); });
        contrastInput.addEventListener('input', (e) => { contrastVal.innerText = e.target.value + '%'; updateFilters(); });

        bwBtn.addEventListener('click', () => {
            isBwOn = !isBwOn;
            bwBtn.classList.toggle('active', isBwOn);
            updateFilters();
        });

        snapBtn.addEventListener('click', () => {
            try {
                if (!video.srcObject) throw new Error("Camera chưa sẵn sàng.");
                if (video.videoWidth === 0 || video.videoHeight === 0) throw new Error("Khung hình chưa load xong.");

                statusDiv.innerText = "Đang xử lý ảnh...";
                
                video.style.opacity = '0.3';
                setTimeout(() => video.style.opacity = '1', 150);

                if (pageCount === 0) {
                    doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                } else {
                    doc.addPage();
                }

                const vw = video.videoWidth;
                const vh = video.videoHeight;
                const cw = video.clientWidth;
                const ch = video.clientHeight;
                const scale = Math.max(cw / vw, ch / vh);
                
                const offsetX = (vw * scale - cw) / 2;
                const offsetY = (vh * scale - ch) / 2;
                const rect = scanRegion.getBoundingClientRect();
                
                const sx = (rect.left + offsetX) / scale;
                const sy = (rect.top + offsetY) / scale;
                const sw = rect.width / scale;
                const sh = rect.height / scale;

                const MAX_WIDTH = 1240; 
                let targetW = sw;
                let targetH = sh;

                if (sw > MAX_WIDTH) {
                    const ratio = MAX_WIDTH / sw;
                    targetW = sw * ratio;
                    targetH = sh * ratio;
                }

                canvas.width = targetW;
                canvas.height = targetH;
                
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(video, sx, sy, sw, sh, 0, 0, targetW, targetH);

                const imgDataObj = ctx.getImageData(0, 0, targetW, targetH);
                const data = imgDataObj.data;
                const b = parseInt(brightnessInput.value) / 100; 
                const c = parseInt(contrastInput.value) / 100; 
                const intercept = 128 * (1 - c);

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i+1], bl = data[i+2];
                    
                    r *= b; g *= b; bl *= b; 
                    
                    r = r * c + intercept; 
                    g = g * c + intercept;
                    bl = bl * c + intercept;
                    
                    if (isBwOn) {
                        const gray = r * 0.299 + g * 0.587 + bl * 0.114;
                        r = g = bl = gray;
                    }
                    
                    data[i] = r; data[i+1] = g; data[i+2] = bl;
                }
                ctx.putImageData(imgDataObj, 0, 0);

                const imgData = canvas.toDataURL('image/jpeg', 0.8);
                
                doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);

                pageCount++;
                updateUI();
                statusDiv.innerHTML = "<span style='color: #00ff00;'>Đã chụp nhanh!</span>";

            } catch (error) {
                statusDiv.innerHTML = `<span style='color: #ff4444; font-weight: bold;'>LỖI: ${error.message}</span>`;
            }
        });

        finishBtn.addEventListener('click', async () => {
            if (pageCount === 0 || !doc) return;

            snapBtn.style.pointerEvents = 'none'; finishBtn.style.pointerEvents = 'none';
            statusDiv.innerHTML = "🚀 Đang đóng gói & tải lên Drive...<br>Sẽ hoàn thành trong vài giây...";

            // Lấy tên từ ô nhập, nếu trống thì quay về PB1301
            let finalFileName = fileNameInput.value.trim();
            if (!finalFileName) finalFileName = DEFAULT_FILE_NAME;
            if (!finalFileName.toLowerCase().endsWith('.pdf')) finalFileName += '.pdf';

            const pdfBase64 = doc.output('datauristring');

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ fileName: finalFileName, base64: pdfBase64 }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    statusDiv.innerHTML = `✅ Thành công! <a href="${result.fileUrl}" target="_blank" style="color:#00ff00; font-weight:bold;">[MỞ FILE]</a>`;
                    pageCount = 0; doc = null;
                    
                    // Khôi phục lại tên mặc định sau khi lưu xong
                    fileNameInput.value = DEFAULT_FILE_NAME; 
                    updateUI();
                } else {
                    statusDiv.innerHTML = "❌ Lỗi server: " + result.message;
                }
            } catch (error) {
                statusDiv.innerHTML = "❌ Lỗi mạng: " + error.message;
            }
            
            snapBtn.style.pointerEvents = 'auto'; 
            if(pageCount > 0) finishBtn.style.pointerEvents = 'auto';
        });
    </script>
</body>
</html>
