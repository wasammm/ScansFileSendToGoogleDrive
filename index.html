<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Máy Quét Cố Định Pro - A4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 0; 
            background: #121212; color: #fff;
            display: flex; flex-direction: column; align-items: center;
        }
        
        #camera-container {
            position: relative; width: 100vw; max-width: 500px; margin-top: 10px;
        }

        video { 
            width: 100%; display: block; object-fit: cover; 
            /* Cài đặt transition mượt mà khi đổi bộ lọc */
            transition: filter 0.3s;
        }

        #guide-frame {
            position: absolute; top: 5%; bottom: 5%; left: 5%; right: 5%;
            border: 2px dashed rgba(0, 255, 100, 0.7); pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        /* Toolbar chứa các công cụ chỉnh sửa */
        .toolbar {
            width: 100%; max-width: 500px; padding: 15px;
            display: flex; flex-direction: column; gap: 12px;
            background: #1e1e1e; border-radius: 8px; margin-top: 10px;
        }

        .tool-row {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }

        .tool-row button {
            flex: 1; padding: 10px; font-size: 14px; font-weight: bold;
            border: 1px solid #444; border-radius: 5px; cursor: pointer;
            background: #333; color: white; transition: 0.2s;
        }
        
        .tool-row button.active { background: #007bff; border-color: #0056b3; }

        .slider-group {
            display: flex; flex-direction: column; gap: 5px; width: 100%;
        }
        .slider-group label { font-size: 13px; color: #bbb; display: flex; justify-content: space-between; }
        .slider-group input[type="range"] { width: 100%; }

        .controls {
            width: 100%; max-width: 500px; padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .action-btn { 
            padding: 15px; font-size: 16px; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer;
        }
        
        #snapBtn { background: #28a745; color: white; }
        #finishBtn { background: #007bff; color: white; display: none; }
        .action-btn:disabled { background: #666; cursor: not-allowed; }

        #status { text-align: center; font-size: 14px; margin-top: 10px; }
        #pageCount { text-align: center; font-size: 18px; font-weight: bold; color: #ffd700; }
        
        canvas { display: none; }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="camera" autoplay playsinline></video>
        <div id="guide-frame"></div>
    </div>

    <!-- Thanh công cụ mới -->
    <div class="toolbar">
        <div class="tool-row">
            <button id="flashBtn">🔦 Flash: Tắt</button>
            <button id="bwBtn">🌗 Trắng Đen: Tắt</button>
        </div>
        
        <div class="slider-group">
            <label><span>Độ Sáng</span> <span id="brightVal">100%</span></label>
            <input type="range" id="brightness" min="50" max="200" value="100">
        </div>
        <div class="slider-group">
            <label><span>Độ Tương Phản</span> <span id="contrastVal">100%</span></label>
            <input type="range" id="contrast" min="50" max="300" value="100">
        </div>
    </div>

    <div class="controls">
        <div id="pageCount">Chưa có trang nào</div>
        <button id="snapBtn" class="action-btn">📸 Chụp Trang 1</button>
        <button id="finishBtn" class="action-btn">🚀 Tạo PDF & Lưu Drive</button>
        <div id="status"></div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        
        // Nút UI
        const snapBtn = document.getElementById('snapBtn');
        const finishBtn = document.getElementById('finishBtn');
        const flashBtn = document.getElementById('flashBtn');
        const bwBtn = document.getElementById('bwBtn');
        const statusDiv = document.getElementById('status');
        const pageCountDiv = document.getElementById('pageCount');
        
        // Input thanh trượt
        const brightnessInput = document.getElementById('brightness');
        const contrastInput = document.getElementById('contrast');
        const brightVal = document.getElementById('brightVal');
        const contrastVal = document.getElementById('contrastVal');

        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyu5vqWfpD9usdQbDO62wchJyaAQ7fDj3K2CZ4wqp0vj-uGdT8-Eu5_zVkeNRB9CXq6/exec'; // THAY URL VÀO ĐÂY

        let doc = null;
        let pageCount = 0;
        let videoTrack = null; // Biến lưu trữ track camera để bật/tắt flash
        
        // Trạng thái bộ lọc
        let isFlashOn = false;
        let isBwOn = false;

        // --- 1. Mở Camera & Lấy Track ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                video.srcObject = stream;
                
                // Lấy track video để điều khiển flash
                videoTrack = stream.getVideoTracks()[0];
                
                // Kiểm tra xem thiết bị có hỗ trợ đèn Flash không
                const capabilities = videoTrack.getCapabilities();
                if (!capabilities.torch) {
                    flashBtn.disabled = true;
                    flashBtn.innerText = "🔦 Flash: Không hỗ trợ";
                }
            } catch (err) {
                statusDiv.innerText = "Lỗi mở camera: " + err.message;
            }
        }
        startCamera();

        // --- 2. Xử lý Flash ---
        flashBtn.addEventListener('click', async () => {
            if (!videoTrack) return;
            try {
                isFlashOn = !isFlashOn;
                // Bật/tắt đèn thông qua Constraints
                await videoTrack.applyConstraints({ advanced: [{ torch: isFlashOn }] });
                
                flashBtn.innerText = isFlashOn ? "🔦 Flash: Đang Bật" : "🔦 Flash: Tắt";
                flashBtn.classList.toggle('active', isFlashOn);
            } catch (err) {
                alert("Lỗi bật Flash. Có thể trình duyệt không cấp quyền.");
                isFlashOn = false;
            }
        });

        // --- 3. Xử lý Bộ Lọc (Sáng, Tối, Trắng Đen) ---
        function applyFilters() {
            let b = brightnessInput.value;
            let c = contrastInput.value;
            
            // Nếu bật Trắng đen, thêm hàm grayscale
            let filterString = `brightness(${b}%) contrast(${c}%) ${isBwOn ? 'grayscale(100%)' : ''}`;
            
            // Cập nhật xem trước trên màn hình
            video.style.filter = filterString;
            return filterString;
        }

        // Bắt sự kiện kéo thanh trượt
        brightnessInput.addEventListener('input', (e) => {
            brightVal.innerText = e.target.value + '%';
            applyFilters();
        });
        
        contrastInput.addEventListener('input', (e) => {
            contrastVal.innerText = e.target.value + '%';
            applyFilters();
        });

        // Bắt sự kiện nút Trắng Đen
        bwBtn.addEventListener('click', () => {
            isBwOn = !isBwOn;
            bwBtn.classList.toggle('active', isBwOn);
            bwBtn.innerText = isBwOn ? "🌗 Trắng Đen: Bật" : "🌗 Trắng Đen: Tắt";
            
            // Mẹo: Khi chuyển sang trắng đen, tăng độ tương phản lên một chút để chữ rõ nét hơn
            if (isBwOn) {
                contrastInput.value = 150;
                contrastVal.innerText = '150%';
            } else {
                contrastInput.value = 100;
                contrastVal.innerText = '100%';
            }
            
            applyFilters();
        });

        // --- 4. Xử lý Chụp ảnh (Gắn bộ lọc vào file PDF) ---
        snapBtn.addEventListener('click', () => {
            if (pageCount === 0) {
                const { jsPDF } = window.jspdf;
                doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            } else {
                doc.addPage();
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // QUAN TRỌNG: Áp dụng chuỗi filter từ UI vào Context của Canvas trước khi vẽ
            ctx.filter = applyFilters(); 
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imgData = canvas.toDataURL('image/jpeg', 0.8);
            doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);

            pageCount++;
            pageCountDiv.innerText = `Đã chụp: ${pageCount} trang`;
            snapBtn.innerText = `📸 Chụp Trang ${pageCount + 1}`;
            
            if (pageCount > 0) finishBtn.style.display = 'block';
        });

        // --- 5. Gửi lên Google Drive ---
        finishBtn.addEventListener('click', async () => {
            if (pageCount === 0) return;

            snapBtn.disabled = true; finishBtn.disabled = true;
            statusDiv.innerHTML = "⏳ Đang xử lý... Đừng đóng trang.";

            const now = new Date();
            const timestamp = now.getFullYear().toString() + (now.getMonth() + 1).toString().padStart(2, '0') + now.getDate().toString().padStart(2, '0') + "_" + now.getHours().toString().padStart(2, '0') + now.getMinutes().toString().padStart(2, '0') + now.getSeconds().toString().padStart(2, '0');
            const fileName = `Scan_${timestamp}.pdf`;

            const pdfBase64 = doc.output('datauristring');

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ fileName: fileName, base64: pdfBase64 }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    statusDiv.innerHTML = `✅ Lưu thành công!<br><a href="${result.fileUrl}" target="_blank" style="color:#00ff00;">🔗 Mở file trên Drive</a>`;
                    pageCount = 0; doc = null;
                    pageCountDiv.innerText = "Đã làm mới, sẵn sàng quét tiếp.";
                    snapBtn.innerText = "📸 Chụp Trang 1";
                    finishBtn.style.display = 'none';
                } else {
                    statusDiv.innerHTML = "❌ Lỗi: " + result.message;
                }
            } catch (error) {
                statusDiv.innerHTML = "❌ Lỗi mạng: " + error.message;
            }

            snapBtn.disabled = false; finishBtn.disabled = false;
        });
    </script>
</body>
</html>
